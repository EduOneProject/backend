extend type Mutation {
    """请求图形验证码"""
    applyImageCaptcha(request: ApplyImageCaptchaRequest): ImageCaptchaResponseBusinessResponse @commonBusinessResponse(for: "ImageCaptchaResponse")
    """校验图形验证码"""
    validateImageCaptcha(request: ImageCaptchaValidRequest): StringBusinessResponse @commonBusinessResponse(for: "String")
}

extend type Query {
    """请求验证上下文"""
    requireVerificationContext(type: String): String
}