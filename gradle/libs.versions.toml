[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
mysqlConnectorJ = "9.7.0"
mybatisPlusBom = "3.5.16"
apacheCommonsCollections4 = "4.5.0"
apacheCommonsLang3 = "3.20.0"
apacheCommonsCodec = "1.22.1"
graphqlJavaExtendedScalars = "24.0"
jsonwebtokenJjwtBom = "0.13.0"

[libraries]
lombok = { module = "org.projectlombok:lombok" }
slf4jApi = { module = "org.slf4j:slf4j-api" }
jakartaServletApi = { module = "jakarta.servlet:jakarta.servlet-api" }
springContext = { module = "org.springframework:spring-context" }
springBoot = { module = "org.springframework.boot:spring-boot" }
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web" }
springBootStarterAspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
springBootStarterDataRedis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
springBootStarterGraphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBootStarterSecurity = { module = "org.springframework.boot:spring-boot-starter-security" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
mybatisPlusJsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser" }
mybatisPlusSpringBoot4Starter = { module = "com.baomidou:mybatis-plus-spring-boot4-starter" }
graphqlJavaExtendedScalars = { module = "com.graphql-java:graphql-java-extended-scalars", version.ref = "graphqlJavaExtendedScalars" }
jjwtApi = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jsonwebtokenJjwtBom" }
jjwtImpl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jsonwebtokenJjwtBom" }
jjwtJackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jsonwebtokenJjwtBom" }
springWeb = { module = "org.springframework:spring-web" }
springDataRedis = { module = "org.springframework.data:spring-data-redis" }
springSecurityCore = { module = "org.springframework.security:spring-security-core" }
springSecurityConfig = { module = "org.springframework.security:spring-security-config" }
springSecurityWeb = { module = "org.springframework.security:spring-security-web" }
jacksonDatabind = { module = "tools.jackson.core:jackson-databind" }
mybatisPlusCore = { module = "com.baomidou:mybatis-plus-core" }
mybatisPlusExtension = { module = "com.baomidou:mybatis-plus-extension" }
# 有显式指定版本的引用
mysqlConnectorJ = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnectorJ" }
mybatisPlusBom = { module = "com.baomidou:mybatis-plus-bom", version.ref = "mybatisPlusBom" }
commonsCollections4 = { module = "org.apache.commons:commons-collections4", version.ref = "apacheCommonsCollections4" }
commonsLang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apacheCommonsLang3" }
commonsCodec = { module = "commons-codec:commons-codec", version.ref = "apacheCommonsCodec" }
jjwtBom = { module = "io.jsonwebtoken:jjwt-bom", version.ref = "jsonwebtokenJjwtBom" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }