"""地区树查询响应"""
type RegionTreeResponse {
    """地区ID"""
    id: String
    """地区编码"""
    code: String
    """上级地区ID"""
    parentId: String
    """上级地区编码"""
    parentCode: String
    """地区路径"""
    path: String
    """地区层级"""
    level: Int
    """地区名称"""
    name: String
    """地区排序"""
    sort: Int
    """地区状态"""
    status: String
}

"""地区树查询条件"""
input RegionTreeQueryRequest {
    """上级地区ID，-1表示顶级"""
    parentIdList: [String]
    """上级地区编码，-1表示顶级"""
    parentCodeList: [String]
    """地区ID，-1表示顶级"""
    idList: [String]
    """地区编码，-1表示顶级"""
    codeList: [String]
    """地区状态"""
    status: String
}

